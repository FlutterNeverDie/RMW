<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWM 편집기</title>
<style>
:root {
  --bg: #0a0a0a; --panel: #111111; --panel2: #171717; --raise: #212121; --line: #242424; --line2: #333333;
  --text: #f2f2f2; --dim: #8a8a8a; --gold: #ffffff; --accent: #c6f432; --on-accent: #0a0a0a;
  --ok: #57a86b; --warn: #d1a12e; --err: #e5484d;
  --r: 7px; --t: 150ms;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r); transition: border-color var(--t), background var(--t); }
button { padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover, select:hover { border-color: #4a4a4a; }
button:active { background: #2b2b2b; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
button.primary:hover { background: #d4ff4a; border-color: #d4ff4a; }
button.primary:disabled { background: var(--raise); border-color: var(--line2); color: var(--dim); opacity: 1; }
button:disabled { opacity: .4; cursor: default; }
button.icon, label.icon { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; background: transparent; border-color: transparent; color: var(--dim); cursor: pointer; border-radius: 6px; }
button.icon:hover, label.icon:hover { color: var(--text); background: var(--raise); }
button.icon.on { color: var(--gold); }
button.icon.play { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
button.icon.play:hover { background: #d4ff4a; color: var(--on-accent); }
select, input { padding: 4px 7px; height: 28px; }
input[type=number] { width: 100%; }
input[type=range] { accent-color: var(--gold); padding: 0; border: 0; background: none; }
textarea { width: 100%; padding: 7px 8px; resize: vertical; min-height: 54px; line-height: 1.5; }
label { display: block; color: var(--dim); font-size: 11.5px; margin: 10px 0 4px; }
.dim { color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.empty { padding: 40px; color: var(--dim); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }

.app { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px; grid-template-rows: 48px minmax(0, 1fr) 290px; grid-template-areas: "h h h" "l s r" "t t r"; }
header { grid-area: h; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 13px; margin: 0 4px 0 0; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
header select { max-width: 320px; }
.counts { color: var(--dim); margin-left: 4px; }
aside.left { grid-area: l; overflow-y: auto; padding: 10px; border-right: 1px solid var(--line); }
aside.right { grid-area: r; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.stage { grid-area: s; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px 8px; }
.playerWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.playerWrap > div { max-height: 100%; max-width: calc((100vh - 400px) * 16 / 9); border-radius: 6px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
.transport { display: flex; gap: 6px; align-items: center; padding-top: 10px; }
.time { font-variant-numeric: tabular-nums; font-size: 14px; margin-left: 8px; }
.transport input[type=range] { width: 140px; }

.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; }
.box.accent { border-color: #3d3d3d; }
.box h3 { margin: 0 0 8px; font-size: 12px; color: var(--text); font-weight: 600; letter-spacing: .2px; }
.boxhead { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
.boxhead h3 { margin: 0 6px 0 0; }
.row { display: flex; gap: 6px; align-items: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 3px 4px; vertical-align: middle; }
td:first-child { width: 64px; }
aside.left td { white-space: nowrap; }
aside.left td:first-child { width: 1%; }
.meter { height: 6px; background: #070707; border-radius: 3px; overflow: hidden; min-width: 60px; }
.meter i { display: block; height: 100%; }
.meter i.ok, .clip.voice.ok { background: var(--ok); }
.meter i.warn, .clip.voice.warn { background: var(--warn); }
.meter i.bad, .clip.voice.bad { background: var(--err); }
.iss { font-size: 11.5px; padding: 4px 7px; border-radius: 5px; margin: 4px 0 0; }
.iss.오류 { background: rgba(229,72,77,.14); color: #f3b0a2; }
.iss.경고 { background: rgba(209,161,46,.12); color: #e9cc8f; }
.picks { list-style: none; margin: 6px 0 0; padding: 0; }
.picks li { cursor: pointer; padding: 4px 7px; border-radius: 5px; margin: 2px 0; font-size: 11.5px; transition: background var(--t); }
.picks li:hover { background: var(--raise); }
.picks .num { color: var(--gold); margin-right: 4px; }
.thumb { width: 52px; height: 62px; position: relative; background: #1e1e1e; border-radius: 6px; flex: none; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }

/* 오른쪽 탭 */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; border-radius: 6px 6px 0 0; padding: 7px 14px; color: var(--dim); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--gold); }
.inspector, .soundPanel { overflow-y: auto; padding: 10px; flex: 1; min-height: 0; }
.search { display: flex; align-items: center; gap: 6px; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r); padding: 0 8px; color: var(--dim); margin-bottom: 10px; }
.search input { border: 0; background: none; flex: 1; padding-left: 0; }
.search input:focus-visible { outline: none; }
.lib { border: 1px dashed transparent; border-radius: 9px; padding: 4px 2px 8px; margin-bottom: 8px; transition: border-color var(--t), background var(--t); }
.lib.over { border-color: var(--gold); background: rgba(255,255,255,.05); }
.libhead { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
.libhead h3 { margin: 0; font-size: 12px; }
.lib h4 { margin: 8px 6px 2px; font-size: 11px; color: var(--dim); font-weight: 500; }
.sounds { list-style: none; margin: 0; padding: 0; }
.sounds li { display: flex; align-items: center; gap: 4px; padding: 1px 2px 1px 0; border-radius: 6px; cursor: grab; transition: background var(--t); }
.sounds li:hover { background: var(--raise); }
.sounds li:active { cursor: grabbing; }
.sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 아래 트랙 */
.tracks { grid-area: t; overflow: auto; position: relative; border-top: 1px solid var(--line); background: #070707; }
/* 줄 너비 = 트랙 전체 길이 → 왼쪽 이름 칸(sticky)이 끝까지 스크롤해도 붙어 있음 */
.track { display: flex; height: 26px; border-bottom: 1px solid #141414; width: max-content; min-width: 100%; }
.track.tall { height: 44px; }
.track.ruler { height: 22px; position: sticky; top: 0; z-index: 3; background: #070707; }
.tname { position: sticky; left: 0; z-index: 2; flex: none; width: 110px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--panel); border-right: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }
.tname .live { color: var(--gold); display: inline-flex; }
.lane { position: relative; flex: none; }
.ruler .lane { cursor: pointer; }
.tick { position: absolute; top: 4px; font-size: 10px; color: #6b6b6b; border-left: 1px solid #262626; padding-left: 4px; height: 14px; font-variant-numeric: tabular-nums; }
.clip { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; overflow: hidden; white-space: nowrap; font-size: 10.5px; padding: 1px 6px; cursor: pointer; color: #fff; border: 1px solid rgba(0,0,0,.45); }
.clip.sel { outline: 2px solid var(--gold); outline-offset: -1px; z-index: 1; }
.clip.scene .lbl { display: block; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.clip.scene small { font-weight: 400; opacity: .78; }
.clip .flag { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ffb3a3; margin-left: 4px; vertical-align: middle; }
.clip .hold { position: absolute; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(0,0,0,.35) 0 4px, transparent 4px 8px); }
.clip .handle { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.clip .handle:hover { background: rgba(255,255,255,.7); }
.clip.char { background: #3a3a3a; }
.clip.sfx { padding: 1px 6px; }
.clip.sfx.auto { background: transparent; border: 1px solid #3a4b5c; color: #7f95ab; }
.clip.sfx.cue { background: #3e6a8f; cursor: grab; z-index: 1; }
.clip.voice.est { opacity: .5; border-style: dashed; border-color: rgba(255,255,255,.45); }
.dropline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 4; pointer-events: none; }

.toast { position: fixed; left: 50%; bottom: 306px; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line2); padding: 7px 14px; border-radius: 20px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

/* 캐릭터 페이지 */
.studio { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
.studioHead { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.studioHead h2 { margin: 0; font-size: 14px; }
.studioBody { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr) 340px; }
.charList { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
.charList > button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border-color: transparent; padding: 5px 6px; margin-bottom: 2px; }
.charList > button:hover { background: var(--raise); }
.charList > button.on { background: var(--raise); border-color: var(--line2); }
.charList b { display: block; font-size: 12px; font-weight: 600; }
.charList small { font-size: 11px; }
.mini { width: 40px; height: 48px; flex: none; background: #1e1e1e; border-radius: 6px; overflow: hidden; }
.mini .fig .body, .mini .fig .hd { animation: none; }
.newChar { display: flex; gap: 4px; margin-top: 8px; }
.newChar input { flex: 1; min-width: 0; }
.charStage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; min-height: 0; background: radial-gradient(circle at 50% 55%, #1c1c1c, var(--bg) 65%); }
.bigFig { width: min(380px, 60vh * 600 / 720); }
.center { justify-content: center; }
.row button.on, .seg button.on { border-color: var(--gold); color: var(--gold); }
.poseStrip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.poseStrip button { width: 92px; padding: 6px 6px 4px; background: var(--panel2); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; }
.poseStrip button.on { border-color: var(--gold); color: var(--gold); }
.poseStrip .fig .body, .poseStrip .fig .hd { animation: none; }
.charForm { overflow-y: auto; padding: 10px; border-left: 1px solid var(--line); background: var(--panel); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 0; }
.field select { width: 100%; }
.colorIn { display: flex; align-items: center; gap: 4px; }
input[type=color] { width: 100%; height: 28px; padding: 2px; cursor: pointer; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--gold); }
details.box summary { cursor: pointer; color: var(--dim); font-size: 12px; }
button.danger { color: #ff8f8f; border-color: #4a2525; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 9px; background: var(--raise); }
.seg button + button { border-left: 1px solid var(--line2); }
.fig { position: relative; width: 100%; aspect-ratio: 600/720; }
.fig > div { position: absolute; inset: 0; }
.fig img { position: absolute; inset: 0; width: 100%; height: 100%; }
.fig .body { animation: breathe 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.fig .hd { animation: sway 5.5s ease-in-out infinite; transform-origin: 50% 62%; }
@keyframes breathe { 50% { transform: scaleY(1.012); } }
@keyframes sway { 25% { transform: rotate(1.5deg) translateY(-3px); } 75% { transform: rotate(-1.5deg); } }
@media (prefers-reduced-motion: reduce) { .fig .body, .fig .hd { animation: none; } }
button.small { padding: 3px 9px; font-size: 12px; }
.playerWrap.over > div { outline: 2px dashed var(--accent); outline-offset: 4px; }
.charGrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.charGrid li { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: grab; transition: border-color var(--t); }
.charGrid li:hover { border-color: var(--line2); }
.charGrid li:active { cursor: grabbing; }
.charGrid .sname { font-size: 12px; font-weight: 600; max-width: 100%; }
.cthumb { position: relative; width: 84px; aspect-ratio: 600/720; }
.cthumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
.badge { font-size: 11.5px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; }
.badge.warn { border-color: #6b5420; color: #e6c46a; }
textarea[readonly], input:disabled, select:disabled { opacity: .55; cursor: not-allowed; }
.charRows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.charRows li { display: flex; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.charRows .cthumb { width: 58px; flex: none; }
.cinfo { flex: 1; min-width: 0; }
.cinfo .row { gap: 6px; }
.cinfo b { font-size: 13px; }
.cinfo .dim { font-size: 11px; }
.cinfo p { margin: 3px 0 5px; font-size: 12px; line-height: 1.45; color: #cfcfcf; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { padding: 1px 7px; font-size: 11px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.cam { display: grid; grid-template-columns: 28px 1fr 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 4px; }
.camLabel { font-size: 11.5px; color: var(--dim); }
.camField { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 2px 4px; margin: 0; font-size: 10.5px; }
.camField span { grid-row: 1; color: var(--dim); }
.camField input[type=range] { grid-row: 1; grid-column: 2; width: 100%; height: 16px; }
.camField input[type=number] { grid-row: 2; grid-column: 1 / 3; height: 24px; font-size: 11.5px; padding: 2px 5px; }
.camField.over input[type=number] { border-color: var(--err); color: #ff8f8f; }
/* 내역 */
.modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: grid; place-items: center; }
.modal { width: min(1000px, 92vw); height: min(640px, 86vh); background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.histBody { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px 1fr; }
.histList { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
.histList button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border-color: transparent; margin-bottom: 2px; }
.histList button.on { background: var(--raise); border-color: var(--line2); }
.histDiff { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; }
table.diff td { border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
table.diff td.num { width: 64px; color: var(--dim); }
.ba { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-size: 12px; }
.ba .b { color: #ff9b9b; text-decoration: line-through; text-decoration-color: rgba(255,155,155,.5); }
.ba .a { color: #b9f27a; }
.histActions { margin-top: auto; padding-top: 12px; justify-content: flex-end; }
/* 저장 */
.saveBox { width: min(460px, 92vw); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.saveBox h2 { margin: 0 0 6px; font-size: 15px; }
.saveBox input { width: 100%; height: 34px; font-size: 14px; }
.savePath { font-size: 11.5px; margin: 8px 0 14px; word-break: break-all; }
.savePath b { color: var(--text); font-weight: 600; }
.busy { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 13px; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.histGroup { margin: 10px 6px 4px; font-size: 11px; color: var(--dim); font-weight: 500; }
.histList button b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.rv { font-size: 10.5px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line2); white-space: nowrap; }
.rv.ok { color: var(--ok); border-color: #2f5a3a; }
.rv.no { color: #e6c46a; border-color: #6b5420; }
/* 우클릭 메뉴 */
.ctx { position: fixed; z-index: 60; min-width: 180px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: flex; flex-direction: column; animation: ctxin 100ms ease-out; }
@keyframes ctxin { from { opacity: 0; transform: translateY(-3px); } }
.ctx button { text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 5px; }
.ctx button:hover:not(:disabled) { background: var(--raise); }
.ctx button.danger { color: #ff8f8f; }
/* 툴팁 */
.tip { position: fixed; z-index: 100; pointer-events: none; background: #f2f2f2; color: #0a0a0a; font-size: 11.5px; font-weight: 500; padding: 4px 8px; border-radius: 5px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.5); transform: translate(-50%, 0); animation: tipin 120ms ease-out; }
@keyframes tipin { from { opacity: 0; transform: translate(-50%, 3px); } }
/* 오른쪽 탭 내용: 스크롤 없이 */
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow-y: auto; }
.pane .box { margin: 0; }
.pane .grow-box { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane .grow-box textarea.fill { flex: 1; min-height: 80px; }
.pane textarea { min-height: 48px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
